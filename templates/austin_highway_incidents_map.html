  const map = map_6c1ee07c792d6073ca0d20a160e8bee3;

  let open = null;
  function setOpen(target) {
    open = target;
    for (const mk of markers) {
      const el = mk.getElement() && mk.getElement().querySelector('.callout-anchor');
      if (el) el.classList.toggle('focused', mk === open);
      mk.setZIndexOffset(mk === open ? 1000 : 0);
    }
  }
  // Center the badge vertically, and horizontally as far as the box allows: if the box would
  // run off the edge, shift the badge toward the opposite side.
  function panToFit(mk) {
    const anchor = mk.getElement().querySelector('.callout-anchor');
    const badge = anchor.getBoundingClientRect(), box = anchor.querySelector('.callout').getBoundingClientRect();
    const size = map.getSize(), pad = 12;
    const badgeX = badge.left + badge.width / 2;
    const reach = anchor.classList.contains('box-right') ? box.right - badgeX : badgeX - box.left;
    let x = size.x / 2;
    if (anchor.classList.contains('box-right')) x = Math.max(pad, Math.min(x, size.x - reach - pad));
    else x = Math.min(size.x - pad, Math.max(x, reach + pad));
    const pt = map.latLngToContainerPoint(mk.getLatLng());
    map.panBy([pt.x - x, pt.y - size.y / 2]);
  }
  for (const mk of markers) {
    mk.on('click', (e) => {
      if (e.originalEvent.target.closest('.callout')) return;  // clicks inside the box itself
      if (open === mk) { setOpen(null); return; }
      setOpen(mk);
      panToFit(mk);
    });
  }
  map.on('click', () => setOpen(null));
})();
