<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Carlton Duke</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #1d1d1d;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
    const canvas = document.getElementById("renderCanvas");
    // adaptToDeviceRatio renders at the display's actual pixel density
    // instead of CSS pixels. Mobile screens are mostly high-DPI, so without
    // this the framebuffer (and everything drawn into it, including the
    // glow layer's blur) is much coarser relative to the physical screen
    // than on desktop -- that's the main reason the glow reads as
    // overwhelming the text there.
    const engine = new BABYLON.Engine(canvas, true, {}, true);
    const isCoarsePointer =
      window.matchMedia && window.matchMedia("(pointer: coarse)").matches;

    // Keeps the whole desk in frame no matter the window's shape. Babylon's
    // default FOV mode holds the *vertical* field of view fixed and derives
    // the horizontal one from the aspect ratio, so the visible width shrinks
    // as the window narrows -- that's what was cutting off the outside
    // monitors when the browser was docked to half the screen.
    //
    // Switching to FOVMODE_HORIZONTAL_FIXED fixes that, but it repurposes
    // camera.fov as the horizontal angle, so the default value (tuned for a
    // vertical FOV) would suddenly describe a much narrower horizontal view
    // than before, cropping it even harder. Instead we compute the
    // horizontal FOV that reproduces the original picture at a normal
    // desktop window (16:9), so nothing changes there, and that same
    // horizontal extent then stays visible at any other window shape.
    const baseRadius = 3.8;
    const baseAspect = 16 / 9;
    const defaultVerticalFov = 0.8; // Babylon's default camera.fov
    const horizontalFov =
      2 * Math.atan(baseAspect * Math.tan(defaultVerticalFov / 2));
    const setupCameraFraming = (camera) => {
      camera.fovMode = BABYLON.Camera.FOVMODE_HORIZONTAL_FIXED;
      camera.fov = horizontalFov;
      camera.radius = baseRadius;
    };

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.07, 1);

      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        -Math.PI / 2,
        Math.PI / 2,
        3.8,
        new BABYLON.Vector3(0, 1.25, 0),
        scene
      );
      // Lets you get much closer to a monitor to read its label -- helpful
      // on mobile where the fixed default framing leaves the text small.
      camera.lowerRadiusLimit = 1.4;
      camera.upperRadiusLimit = 14;
      camera.wheelPrecision = 50;
      camera.attachControl(canvas, true);
      setupCameraFraming(camera);

      // Right-click resets the camera to its starting framing. Gated on
      // pointerType "mouse" (desktop only) since a touch long-press also
      // fires as a right click. A pointerdown/up pair that stays roughly in
      // place counts as a click and resets; one that moves was a drag (e.g.
      // right-click-panning) and is left alone.
      const defaultCameraState = {
        alpha: camera.alpha,
        beta: camera.beta,
        radius: camera.radius,
        target: camera.target.clone(),
      };

      const nearestEquivalentAngle = (current, target) => {
        const twoPi = Math.PI * 2;
        const raw = target - current;
        return current + (raw - twoPi * Math.round(raw / twoPi));
      };

      const resetCameraView = () => {
        const frameRate = 30;
        const totalFrames = frameRate * 0.4;
        const easing = new BABYLON.CubicEase();
        easing.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);
        const loop = BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT;

        BABYLON.Animation.CreateAndStartAnimation(
          "cameraResetAlpha", camera, "alpha", frameRate, totalFrames,
          camera.alpha, nearestEquivalentAngle(camera.alpha, defaultCameraState.alpha), loop, easing
        );
        BABYLON.Animation.CreateAndStartAnimation(
          "cameraResetBeta", camera, "beta", frameRate, totalFrames,
          camera.beta, defaultCameraState.beta, loop, easing
        );
        BABYLON.Animation.CreateAndStartAnimation(
          "cameraResetRadius", camera, "radius", frameRate, totalFrames,
          camera.radius, defaultCameraState.radius, loop, easing
        );
        BABYLON.Animation.CreateAndStartAnimation(
          "cameraResetTarget", camera, "target", frameRate, totalFrames,
          camera.target.clone(), defaultCameraState.target.clone(), loop, easing
        );
      };

      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      let rightClickStart = null;
      canvas.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button === 2) {
          rightClickStart = { x: e.clientX, y: e.clientY };
        }
      });
      canvas.addEventListener("pointerup", (e) => {
        if (e.pointerType !== "mouse" || e.button !== 2 || !rightClickStart) {
          return;
        }
        const moved = Math.hypot(e.clientX - rightClickStart.x, e.clientY - rightClickStart.y);
        rightClickStart = null;
        if (moved < 4) {
          resetCameraView();
        }
      });

      const ambient = new BABYLON.HemisphericLight(
        "ambient",
        new BABYLON.Vector3(0, 1, 0),
        scene
      );
      ambient.intensity = 0.7;

      // A soft key light so the desk/monitor bodies read as more than silhouettes.
      const key = new BABYLON.DirectionalLight(
        "key",
        new BABYLON.Vector3(-0.3, -1, 0.5),
        scene
      );
      key.intensity = 0.5;

      // Glow layer makes the emissive monitor screens actually look lit.
      // A smaller blur kernel than the (32px) default keeps the bloom from
      // bleeding all the way across the screens' black bezels. On touch
      // devices we go even smaller/dimmer -- the label text sits much
      // closer (in screen-space pixels) to the glowing screen edge than on
      // a typical desktop viewport, so the same blur reads as washing the
      // text out.
      const glow = new BABYLON.GlowLayer("glow", scene, {
        blurKernelSize: isCoarsePointer ? 4 : 8,
      });
      glow.intensity = isCoarsePointer ? 0.6 : 1;

      // Galaxy skybox: a big inverted sphere textured with a procedurally
      // drawn starfield/nebula, so no external image assets are needed.
      const skybox = BABYLON.MeshBuilder.CreateSphere(
        "galaxySkybox",
        { diameter: 1000, segments: 32 },
        scene
      );
      skybox.infiniteDistance = true;

      const skyW = 2048;
      const skyH = 1024;
      const skyTexture = new BABYLON.DynamicTexture(
        "galaxyTexture",
        { width: skyW, height: skyH },
        scene,
        false
      );
      const skyCtx = skyTexture.getContext();

      const bgGradient = skyCtx.createLinearGradient(0, 0, 0, skyH);
      bgGradient.addColorStop(0, "#020208");
      bgGradient.addColorStop(0.5, "#06061a");
      bgGradient.addColorStop(1, "#020208");
      skyCtx.fillStyle = bgGradient;
      skyCtx.fillRect(0, 0, skyW, skyH);

      // Soft nebula clouds
      const nebulaColors = [
        "rgba(130, 70, 210, 0.35)",
        "rgba(40, 100, 220, 0.3)",
        "rgba(210, 70, 160, 0.25)",
        "rgba(60, 200, 200, 0.2)",
      ];
      for (let i = 0; i < 28; i++) {
        const cx = Math.random() * skyW;
        const cy = skyH * 0.3 + Math.random() * skyH * 0.4;
        const radius = 100 + Math.random() * 260;
        const color = nebulaColors[Math.floor(Math.random() * nebulaColors.length)];
        const grad = skyCtx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        grad.addColorStop(0, color);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        skyCtx.fillStyle = grad;
        skyCtx.beginPath();
        skyCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        skyCtx.fill();
      }

      // Brighter galactic band running across the middle
      const bandGrad = skyCtx.createLinearGradient(0, skyH * 0.2, 0, skyH * 0.6);
      bandGrad.addColorStop(0, "rgba(255,255,255,0)");
      bandGrad.addColorStop(0.5, "rgba(210,210,255,0.18)");
      bandGrad.addColorStop(1, "rgba(255,255,255,0)");
      skyCtx.fillStyle = bandGrad;
      skyCtx.fillRect(0, skyH * 0.2, skyW, skyH * 0.4);

      // Stars, denser near the galactic band
      const bandCenter = skyH * 0.42;
      const bandSpread = skyH * 0.12;
      for (let i = 0; i < 6000; i++) {
        const x = Math.random() * skyW;
        const y = Math.random() * skyH;
        const dist = y - bandCenter;
        const density = 0.15 + Math.exp(-(dist * dist) / (2 * bandSpread * bandSpread)) * 0.85;
        if (Math.random() > density) continue;
        const size = Math.random() < 0.05 ? 1 + Math.random() * 1.8 : Math.random();
        const brightness = 0.5 + Math.random() * 0.5;
        skyCtx.fillStyle = `rgba(255,255,255,${brightness})`;
        skyCtx.beginPath();
        skyCtx.arc(x, y, size, 0, Math.PI * 2);
        skyCtx.fill();
      }

      // "carltonduke.com" rendered into the distant sky out of glowing
      // starlight, nebula haze and a couple of little galaxies. The camera
      // starts at alpha = -PI/2 looking toward world +Z, and this sphere's
      // default UV mapping puts +Z at u = 0.75, so centering the text there
      // keeps it sitting in the sky above the monitors from the very first
      // frame, no orbiting required.
      //
      // Vertically, DynamicTexture samples this canvas upside down (v = 0,
      // the canvas top, ends up rendered at the bottom of the sky and vice
      // versa), confirmed by test-rendering marker shapes at known
      // canvas positions. So to land well above the monitors we draw near
      // the BOTTOM of the canvas (large y fraction), and the glyphs
      // themselves are drawn through a vertical mirror further down so
      // they still read right-side up once that flip is applied.
      const brandText = "carltonduke.com";
      const textCenterX = skyW * 0.75;
      const textCenterY = skyH * 0.58;
      skyCtx.textAlign = "center";
      skyCtx.textBaseline = "middle";

      // Auto-fit the font size to a target width (comfortably inside the
      // ~20%-of-width slice of sky the default camera framing shows) rather
      // than guessing a pixel size that happens to fit "carltonduke.com".
      const targetTextWidth = skyW * 0.166;
      let brandFontSize = 60;
      skyCtx.font = `700 ${brandFontSize}px Arial, sans-serif`;
      brandFontSize *= targetTextWidth / skyCtx.measureText(brandText).width;
      skyCtx.font = `700 ${brandFontSize}px Arial, sans-serif`;
      const brandTextWidth = skyCtx.measureText(brandText).width;

      // Nebula haze glowing behind the letters.
      for (let i = 0; i < 10; i++) {
        const bx = textCenterX - brandTextWidth / 2 + Math.random() * brandTextWidth;
        const by = textCenterY + (Math.random() - 0.5) * brandFontSize * 1.4;
        const br = brandFontSize * (0.7 + Math.random() * 0.6);
        const color = nebulaColors[Math.floor(Math.random() * nebulaColors.length)];
        const grad = skyCtx.createRadialGradient(bx, by, 0, bx, by, br);
        grad.addColorStop(0, color);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        skyCtx.fillStyle = grad;
        skyCtx.beginPath();
        skyCtx.arc(bx, by, br, 0, Math.PI * 2);
        skyCtx.fill();
      }

      // A couple of small galaxies flanking the text: an elliptical,
      // slightly rotated halo around a bright pinpoint core.
      const drawGalaxy = (gx, gy, size, haloColor) => {
        skyCtx.save();
        skyCtx.translate(gx, gy);
        skyCtx.rotate((Math.random() - 0.5) * 0.6);
        skyCtx.scale(1.7, 0.55);
        const halo = skyCtx.createRadialGradient(0, 0, 0, 0, 0, size);
        halo.addColorStop(0, "rgba(255,255,255,0.9)");
        halo.addColorStop(0.18, haloColor);
        halo.addColorStop(1, "rgba(0,0,0,0)");
        skyCtx.fillStyle = halo;
        skyCtx.beginPath();
        skyCtx.arc(0, 0, size, 0, Math.PI * 2);
        skyCtx.fill();
        skyCtx.restore();
      };
      drawGalaxy(
        textCenterX - brandTextWidth / 2 - brandFontSize * 1.6,
        textCenterY - brandFontSize * 0.3,
        brandFontSize * 0.85,
        "rgba(170, 130, 255, 0.55)"
      );
      drawGalaxy(
        textCenterX + brandTextWidth / 2 + brandFontSize * 1.5,
        textCenterY + brandFontSize * 0.35,
        brandFontSize * 0.75,
        "rgba(255, 150, 200, 0.5)"
      );

      // Everything from here down (the glyphs and the star-dust traced over
      // them) is drawn through a vertical mirror around the text's own
      // center, to cancel out the sphere's vertical flip described above -
      // without this they'd render upside down.
      skyCtx.save();
      skyCtx.translate(0, textCenterY);
      skyCtx.scale(1, -1);
      skyCtx.translate(0, -textCenterY);

      // The glowing text itself: layered shadowBlur passes build a soft
      // halo, then a crisp bright core on top.
      skyCtx.save();
      skyCtx.shadowColor = "rgba(150, 200, 255, 0.9)";
      skyCtx.shadowBlur = brandFontSize * 0.9;
      skyCtx.fillStyle = "rgba(255,255,255,0.85)";
      skyCtx.fillText(brandText, textCenterX, textCenterY);
      skyCtx.fillText(brandText, textCenterX, textCenterY);
      skyCtx.shadowBlur = brandFontSize * 0.35;
      skyCtx.shadowColor = "rgba(210, 225, 255, 0.9)";
      skyCtx.fillText(brandText, textCenterX, textCenterY);
      skyCtx.shadowBlur = brandFontSize * 0.1;
      skyCtx.shadowColor = "#ffffff";
      skyCtx.fillStyle = "#f4f9ff";
      skyCtx.fillText(brandText, textCenterX, textCenterY);
      skyCtx.restore();

      // Finally, scatter individual bright "stars" traced over the glyph
      // shapes on top of the glow, so the letters read as if they're
      // composed of starlight rather than a flat fill. Sampled from an
      // offscreen render of the same text.
      const maskPadding = brandFontSize * 0.5;
      const maskW = Math.ceil(brandTextWidth + maskPadding * 2);
      const maskH = Math.ceil(brandFontSize * 1.6);
      const maskCanvas = document.createElement("canvas");
      maskCanvas.width = maskW;
      maskCanvas.height = maskH;
      const maskCtx = maskCanvas.getContext("2d");
      maskCtx.font = skyCtx.font;
      maskCtx.textAlign = "center";
      maskCtx.textBaseline = "middle";
      maskCtx.fillStyle = "#fff";
      maskCtx.fillText(brandText, maskW / 2, maskH / 2);
      const maskData = maskCtx.getImageData(0, 0, maskW, maskH).data;
      const maskOriginX = textCenterX - maskW / 2;
      const maskOriginY = textCenterY - maskH / 2;
      for (let my = 0; my < maskH; my++) {
        for (let mx = 0; mx < maskW; mx++) {
          if (maskData[(my * maskW + mx) * 4 + 3] < 120) continue;
          if (Math.random() > 0.4) continue;
          const size = Math.random() < 0.12 ? 1.4 + Math.random() * 1.6 : 0.5 + Math.random() * 0.9;
          const brightness = 0.6 + Math.random() * 0.4;
          skyCtx.fillStyle = `rgba(225, 240, 255, ${brightness})`;
          skyCtx.beginPath();
          skyCtx.arc(
            maskOriginX + mx + (Math.random() - 0.5),
            maskOriginY + my + (Math.random() - 0.5),
            size,
            0,
            Math.PI * 2
          );
          skyCtx.fill();
        }
      }
      skyCtx.restore(); // end vertical-mirror wrapper

      skyTexture.update();

      const skyboxMat = new BABYLON.StandardMaterial("galaxySkyboxMat", scene);
      skyboxMat.backFaceCulling = false;
      skyboxMat.disableLighting = true;
      skyboxMat.emissiveTexture = skyTexture;
      skyboxMat.diffuseColor = BABYLON.Color3.Black();
      skyboxMat.specularColor = BABYLON.Color3.Black();
      skybox.material = skyboxMat;

      // Comets: small glowing "heads" that streak across the sky on a
      // straight chord through a shell around the scene, each dragging a
      // TrailMesh tail (a ribbon that tapers to a point, which is what
      // gives it the comet-tail look). Both head and trail are emissive, so
      // the existing GlowLayer picks them up automatically.
      const cometColors = [
        new BABYLON.Color3(0.8, 0.9, 1),
        new BABYLON.Color3(1, 0.95, 0.85),
      ];
      const cometShellRadius = 220;
      const randomSkyPoint = () => {
        // Biased toward the upper hemisphere so comets read as sky, not
        // ground traffic, while still dipping slightly below the horizon.
        // theta is also biased toward the camera's default forward-facing
        // direction (+Z, i.e. PI/2 here) so comets are actually visible on
        // first load rather than only when orbiting around.
        const theta = Math.PI / 2 + BABYLON.Scalar.RandomRange(-1.4, 1.4);
        const phi = Math.acos(BABYLON.Scalar.RandomRange(-0.2, 0.9));
        return new BABYLON.Vector3(
          cometShellRadius * Math.sin(phi) * Math.cos(theta),
          cometShellRadius * Math.cos(phi),
          cometShellRadius * Math.sin(phi) * Math.sin(theta)
        );
      };

      const createComet = (index) => {
        const color = cometColors[index % cometColors.length];
        const head = BABYLON.MeshBuilder.CreateSphere(
          `comet${index}Head`,
          { diameter: 0.5, segments: 6 },
          scene
        );
        const headMat = new BABYLON.StandardMaterial(`comet${index}HeadMat`, scene);
        headMat.diffuseColor = BABYLON.Color3.Black();
        headMat.specularColor = BABYLON.Color3.Black();
        headMat.emissiveColor = color;
        headMat.disableLighting = true;
        head.material = headMat;
        head.setEnabled(false);

        let trail = null;
        let start = BABYLON.Vector3.Zero();
        let end = BABYLON.Vector3.Zero();
        let passStart = 0;
        let duration = 1;

        // A teleporting emitter would otherwise leave a spurious straight
        // line across the sky in the old trail's history, so each pass gets
        // a brand new TrailMesh rather than reusing one.
        const beginPass = () => {
          if (trail) trail.dispose();
          start = randomSkyPoint();
          end = randomSkyPoint();
          head.position.copyFrom(start);
          trail = new BABYLON.TrailMesh(`comet${index}Trail`, head, scene, 0.22, 40, true);
          const trailMat = new BABYLON.StandardMaterial(`comet${index}TrailMat`, scene);
          trailMat.diffuseColor = BABYLON.Color3.Black();
          trailMat.specularColor = BABYLON.Color3.Black();
          trailMat.emissiveColor = color;
          trailMat.disableLighting = true;
          trailMat.alpha = 0.45;
          trailMat.alphaMode = BABYLON.Engine.ALPHA_ADD;
          trail.material = trailMat;

          duration = 3500 + Math.random() * 3000;
          passStart = performance.now();
          head.setEnabled(true);
        };

        scene.onBeforeRenderObservable.add(() => {
          const t = (performance.now() - passStart) / duration;
          if (t >= 1) {
            head.setEnabled(false);
            trail.setEnabled(false);
            passStart = Infinity; // hold until the delayed beginPass() below fires
            setTimeout(beginPass, 4000 + Math.random() * 8000);
            return;
          }
          BABYLON.Vector3.LerpToRef(start, end, t, head.position);
        });

        beginPass();
      };

      createComet(0);
      setTimeout(() => createComet(1), 3000);

      // Desk
      const deskHeight = 0.75;
      const deskTop = BABYLON.MeshBuilder.CreateBox(
        "deskTop",
        { width: 3.8, depth: 1.4, height: 0.08 },
        scene
      );
      deskTop.position.y = deskHeight;

      // Shiny brushed-metal look: bright specular highlight plus a spherical
      // reflection of the galaxy texture so the desk visibly mirrors the sky.
      // Built from a base64 snapshot of the canvas (not skyTexture directly)
      // so it loads as an independent, ready texture rather than a dynamic
      // one materials would wait on forever.
      const metalReflection = BABYLON.Texture.CreateFromBase64String(
        skyTexture.getContext().canvas.toDataURL(),
        "galaxyReflection",
        scene
      );
      metalReflection.coordinatesMode = BABYLON.Texture.SPHERICAL_MODE;
      metalReflection.level = 0.4;

      const metalMat = new BABYLON.StandardMaterial("metalMat", scene);
      metalMat.diffuseColor = new BABYLON.Color3(0.03, 0.03, 0.03);
      metalMat.specularColor = new BABYLON.Color3(1, 1, 1);
      metalMat.specularPower = 128;
      metalMat.reflectionTexture = metalReflection;
      deskTop.material = metalMat;

      const legMat = new BABYLON.StandardMaterial("legMat", scene);
      legMat.diffuseColor = new BABYLON.Color3(0.02, 0.02, 0.02);
      legMat.specularColor = new BABYLON.Color3(1, 1, 1);
      legMat.specularPower = 128;
      legMat.reflectionTexture = metalReflection;
      const legPositions = [
        [-1.75, 0.55],
        [1.75, 0.55],
        [-1.75, -0.55],
        [1.75, -0.55],
      ];
      legPositions.forEach(([x, z], i) => {
        const leg = BABYLON.MeshBuilder.CreateBox(
          `leg${i}`,
          { width: 0.1, depth: 0.1, height: deskHeight },
          scene
        );
        leg.position.set(x, deskHeight / 2, z);
        leg.material = legMat;
      });

      // Reusable materials for monitor bodies
      const bodyMat = new BABYLON.StandardMaterial("bodyMat", scene);
      bodyMat.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      bodyMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

      // Renders a label onto a small DynamicTexture: transparent everywhere
      // except the word itself, in dark ink. This goes on its own separate,
      // non-emissive mesh layered just in front of the screen (see below)
      // rather than onto the screen's own material, because GlowLayer
      // blooms a mesh's flat emissiveColor regardless of any
      // emissiveTexture (see the bezel-margin comment above) - painting the
      // word directly onto the glowing screen just gets it washed out by
      // that uniform bloom. A separate, barely-emissive mesh sidesteps that
      // entirely: it contributes ~nothing to the glow pass, so the text
      // stays crisp and dark while the glowing screen still shows through
      // around it.
      const createLabelTexture = (name, text, aspect) => {
        const texW = 1024;
        const texH = Math.round(texW / aspect);
        const tex = new BABYLON.DynamicTexture(
          `${name}LabelTexture`,
          { width: texW, height: texH },
          scene,
          true
        );
        tex.hasAlpha = true;
        const ctx = tex.getContext();
        ctx.clearRect(0, 0, texW, texH);

        ctx.fillStyle = "#111114";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        const targetWidth = texW * 0.74;
        let fontSize = 80;
        ctx.font = `700 ${fontSize}px Arial, sans-serif`;
        fontSize *= targetWidth / ctx.measureText(text).width;
        ctx.font = `700 ${fontSize}px Arial, sans-serif`;
        ctx.fillText(text, texW / 2, texH / 2);

        tex.update();
        return tex;
      };

      // Builds one monitor (stand + screen), wires up glow + click-to-navigate.
      const createMonitor = ({ name, x, rotationY, color, url, label }) => {
        const pivot = new BABYLON.TransformNode(`${name}Pivot`, scene);
        pivot.position.set(x, deskHeight, 0);
        pivot.rotation.y = rotationY;

        const base = BABYLON.MeshBuilder.CreateCylinder(
          `${name}Base`,
          { diameter: 0.4, height: 0.03 },
          scene
        );
        base.parent = pivot;
        base.position.set(0, 0.015, 0.05);
        base.material = bodyMat;

        const neck = BABYLON.MeshBuilder.CreateBox(
          `${name}Neck`,
          { width: 0.08, depth: 0.08, height: 0.35 },
          scene
        );
        neck.parent = pivot;
        neck.position.set(0, 0.19, 0.05);
        neck.material = bodyMat;

        // The monitor "head" is a plain dark box (bezel + back). A solid box
        // always culls correctly from every viewing angle, so unlike a thin
        // plane it can never disappear (black) from the front or glow
        // through from the back.
        const headWidth = 1.15;
        const headHeight = 0.68;
        const headDepth = 0.05;
        const head = BABYLON.MeshBuilder.CreateBox(
          `${name}Head`,
          { width: headWidth, height: headHeight, depth: headDepth },
          scene
        );
        head.parent = pivot;
        head.position.set(0, 0.72, 0);
        head.material = bodyMat;

        // The glowing screen is a separate, smaller box floating just in
        // front of the head's face, leaving a strip of the dark bezel
        // showing all the way around it. Keeping it as its own mesh (rather
        // than a masked texture on the head's face): GlowLayer
        // blooms from a material's flat emissiveColor and ignores any
        // emissiveTexture, so a black border painted into a texture still
        // glows at full brightness, only real geometry actually blocks it.
        const bezelMargin = 0.06;
        const screenMat = new BABYLON.StandardMaterial(`${name}ScreenMat`, scene);
        const emissive = color.scale(2); // 100% brighter than the base color
        screenMat.diffuseColor = color;
        screenMat.emissiveColor = emissive;
        screenMat.specularColor = BABYLON.Color3.Black();
        screenMat.disableLighting = true; // always reads fully lit, regardless of scene lighting

        const screen = BABYLON.MeshBuilder.CreateBox(
          `${name}Screen`,
          {
            width: headWidth - bezelMargin * 2,
            height: headHeight - bezelMargin * 2,
            depth: 0.01,
          },
          scene
        );
        screen.parent = pivot;
        // Babylon's box face order puts "front" on the -Z side; nudge the
        // screen just past the head's front face (at -headDepth / 2) so it
        // sits proud of the bezel instead of z-fighting with it.
        screen.position.set(0, 0.72, -headDepth / 2 - 0.008);
        screen.material = screenMat;

        let labelPlane = null;
        if (label) {
          const screenWidth = headWidth - bezelMargin * 2;
          const screenHeight = headHeight - bezelMargin * 2;
          const labelMat = new BABYLON.StandardMaterial(`${name}LabelMat`, scene);
          labelMat.diffuseTexture = createLabelTexture(name, label, screenWidth / screenHeight);
          labelMat.diffuseTexture.hasAlpha = true;
          labelMat.useAlphaFromDiffuseTexture = true;
          labelMat.emissiveColor = new BABYLON.Color3(0.02, 0.02, 0.02);
          labelMat.specularColor = BABYLON.Color3.Black();
          labelMat.disableLighting = true;

          labelPlane = BABYLON.MeshBuilder.CreateBox(
            `${name}Label`,
            { width: screenWidth, height: screenHeight, depth: 0.005 },
            scene
          );
          labelPlane.parent = pivot;
          // A hair closer to the camera than the screen itself so it draws
          // on top without z-fighting.
          labelPlane.position.set(0, 0.72, -headDepth / 2 - 0.012);
          labelPlane.material = labelMat;
        }

        // Colored light spilling from the screen onto the desk, like a lit monitor.
        const spill = new BABYLON.PointLight(
          `${name}Light`,
          new BABYLON.Vector3(0, 0.55, -0.2),
          scene
        );
        spill.parent = pivot;
        spill.diffuse = color;
        spill.intensity = 0.9;
        spill.range = 2.5;

        // Click / hover behavior. The screen mesh floats just in front of
        // the head, so it's what actually gets picked at the center of the
        // monitor - both meshes share one ActionManager so clicking either
        // the screen or the surrounding bezel/back navigates.
        const actionManager = new BABYLON.ActionManager(scene);
        actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, () => {
            window.open(url, "_blank", "noopener");
          })
        );
        actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPointerOverTrigger, () => {
            canvas.style.cursor = "pointer";
            screenMat.emissiveColor = emissive.scale(1.3);
          })
        );
        actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPointerOutTrigger, () => {
            canvas.style.cursor = "default";
            screenMat.emissiveColor = emissive;
          })
        );
        head.actionManager = actionManager;
        screen.actionManager = actionManager;
        if (labelPlane) {
          labelPlane.actionManager = actionManager;
        }

        return pivot;
      };

      createMonitor({
        name: "left",
        x: -1.4,
        rotationY: -Math.PI / 7, // angled inward, toward the center monitor
        color: new BABYLON.Color3(1, 1, 1), // white
        url: "https://linkedin.com/in/carltonduke/",
        label: "linkedin",
      });

      createMonitor({
        name: "center",
        x: 0,
        rotationY: 0,
        color: new BABYLON.Color3(0.15, 0.45, 1), // blue
        url: "https://drive.google.com/file/d/1Qok8LrV_gHALDDJedJI1MqsuTE3n3GLh/view?usp=drive_link",
        label: "resume",
      });

      createMonitor({
        name: "right",
        x: 1.4,
        rotationY: Math.PI / 7, // angled inward, toward the center monitor
        color: new BABYLON.Color3(1, 0.85, 0.1), // yellow
        url: "https://github.com/carltonduke/",
        label: "github",
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
