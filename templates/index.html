<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Babylon.js Scene</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #1d1d1d;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.07, 1);

      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        -Math.PI / 2,
        Math.PI / 2,
        3.8,
        new BABYLON.Vector3(0, 1.25, 0),
        scene
      );
      camera.lowerRadiusLimit = 2.5;
      camera.upperRadiusLimit = 14;
      camera.wheelPrecision = 50;
      camera.attachControl(canvas, true);

      const ambient = new BABYLON.HemisphericLight(
        "ambient",
        new BABYLON.Vector3(0, 1, 0),
        scene
      );
      ambient.intensity = 0.7;

      // A soft key light so the desk/monitor bodies read as more than silhouettes.
      const key = new BABYLON.DirectionalLight(
        "key",
        new BABYLON.Vector3(-0.3, -1, 0.5),
        scene
      );
      key.intensity = 0.5;

      // Glow layer makes the emissive monitor screens actually look lit.
      const glow = new BABYLON.GlowLayer("glow", scene);
      glow.intensity = 1;

      // Galaxy skybox: a big inverted sphere textured with a procedurally
      // drawn starfield/nebula, so no external image assets are needed.
      const skybox = BABYLON.MeshBuilder.CreateSphere(
        "galaxySkybox",
        { diameter: 1000, segments: 32 },
        scene
      );
      skybox.infiniteDistance = true;

      const skyW = 2048;
      const skyH = 1024;
      const skyTexture = new BABYLON.DynamicTexture(
        "galaxyTexture",
        { width: skyW, height: skyH },
        scene,
        false
      );
      const skyCtx = skyTexture.getContext();

      const bgGradient = skyCtx.createLinearGradient(0, 0, 0, skyH);
      bgGradient.addColorStop(0, "#020208");
      bgGradient.addColorStop(0.5, "#06061a");
      bgGradient.addColorStop(1, "#020208");
      skyCtx.fillStyle = bgGradient;
      skyCtx.fillRect(0, 0, skyW, skyH);

      // Soft nebula clouds
      const nebulaColors = [
        "rgba(130, 70, 210, 0.35)",
        "rgba(40, 100, 220, 0.3)",
        "rgba(210, 70, 160, 0.25)",
        "rgba(60, 200, 200, 0.2)",
      ];
      for (let i = 0; i < 28; i++) {
        const cx = Math.random() * skyW;
        const cy = skyH * 0.3 + Math.random() * skyH * 0.4;
        const radius = 100 + Math.random() * 260;
        const color = nebulaColors[Math.floor(Math.random() * nebulaColors.length)];
        const grad = skyCtx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        grad.addColorStop(0, color);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        skyCtx.fillStyle = grad;
        skyCtx.beginPath();
        skyCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        skyCtx.fill();
      }

      // Brighter galactic band running across the middle
      const bandGrad = skyCtx.createLinearGradient(0, skyH * 0.2, 0, skyH * 0.6);
      bandGrad.addColorStop(0, "rgba(255,255,255,0)");
      bandGrad.addColorStop(0.5, "rgba(210,210,255,0.18)");
      bandGrad.addColorStop(1, "rgba(255,255,255,0)");
      skyCtx.fillStyle = bandGrad;
      skyCtx.fillRect(0, skyH * 0.2, skyW, skyH * 0.4);

      // Stars, denser near the galactic band
      const bandCenter = skyH * 0.42;
      const bandSpread = skyH * 0.12;
      for (let i = 0; i < 6000; i++) {
        const x = Math.random() * skyW;
        const y = Math.random() * skyH;
        const dist = y - bandCenter;
        const density = 0.15 + Math.exp(-(dist * dist) / (2 * bandSpread * bandSpread)) * 0.85;
        if (Math.random() > density) continue;
        const size = Math.random() < 0.05 ? 1 + Math.random() * 1.8 : Math.random();
        const brightness = 0.5 + Math.random() * 0.5;
        skyCtx.fillStyle = `rgba(255,255,255,${brightness})`;
        skyCtx.beginPath();
        skyCtx.arc(x, y, size, 0, Math.PI * 2);
        skyCtx.fill();
      }

      skyTexture.update();

      const skyboxMat = new BABYLON.StandardMaterial("galaxySkyboxMat", scene);
      skyboxMat.backFaceCulling = false;
      skyboxMat.disableLighting = true;
      skyboxMat.emissiveTexture = skyTexture;
      skyboxMat.diffuseColor = BABYLON.Color3.Black();
      skyboxMat.specularColor = BABYLON.Color3.Black();
      skybox.material = skyboxMat;

      // Desk
      const deskHeight = 0.75;
      const deskTop = BABYLON.MeshBuilder.CreateBox(
        "deskTop",
        { width: 3.8, depth: 1.4, height: 0.08 },
        scene
      );
      deskTop.position.y = deskHeight;

      // Shiny brushed-metal look: bright specular highlight plus a spherical
      // reflection of the galaxy texture so the desk visibly mirrors the sky.
      // Built from a base64 snapshot of the canvas (not skyTexture directly)
      // so it loads as an independent, ready texture rather than a dynamic
      // one materials would wait on forever.
      const metalReflection = BABYLON.Texture.CreateFromBase64String(
        skyTexture.getContext().canvas.toDataURL(),
        "galaxyReflection",
        scene
      );
      metalReflection.coordinatesMode = BABYLON.Texture.SPHERICAL_MODE;
      metalReflection.level = 0.4;

      const metalMat = new BABYLON.StandardMaterial("metalMat", scene);
      metalMat.diffuseColor = new BABYLON.Color3(0.03, 0.03, 0.03);
      metalMat.specularColor = new BABYLON.Color3(1, 1, 1);
      metalMat.specularPower = 128;
      metalMat.reflectionTexture = metalReflection;
      deskTop.material = metalMat;

      const legMat = new BABYLON.StandardMaterial("legMat", scene);
      legMat.diffuseColor = new BABYLON.Color3(0.02, 0.02, 0.02);
      legMat.specularColor = new BABYLON.Color3(1, 1, 1);
      legMat.specularPower = 128;
      legMat.reflectionTexture = metalReflection;
      const legPositions = [
        [-1.75, 0.55],
        [1.75, 0.55],
        [-1.75, -0.55],
        [1.75, -0.55],
      ];
      legPositions.forEach(([x, z], i) => {
        const leg = BABYLON.MeshBuilder.CreateBox(
          `leg${i}`,
          { width: 0.1, depth: 0.1, height: deskHeight },
          scene
        );
        leg.position.set(x, deskHeight / 2, z);
        leg.material = legMat;
      });

      // Reusable materials for monitor bodies
      const bodyMat = new BABYLON.StandardMaterial("bodyMat", scene);
      bodyMat.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      bodyMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

      // Builds one monitor (stand + screen), wires up glow + click-to-navigate.
      const createMonitor = ({ name, x, rotationY, color, url }) => {
        const pivot = new BABYLON.TransformNode(`${name}Pivot`, scene);
        pivot.position.set(x, deskHeight, 0);
        pivot.rotation.y = rotationY;

        const base = BABYLON.MeshBuilder.CreateCylinder(
          `${name}Base`,
          { diameter: 0.4, height: 0.03 },
          scene
        );
        base.parent = pivot;
        base.position.set(0, 0.015, 0.05);
        base.material = bodyMat;

        const neck = BABYLON.MeshBuilder.CreateBox(
          `${name}Neck`,
          { width: 0.08, depth: 0.08, height: 0.35 },
          scene
        );
        neck.parent = pivot;
        neck.position.set(0, 0.19, 0.05);
        neck.material = bodyMat;

        // The monitor "head" is a single box: one face is the glowing screen,
        // the other five are the dark bezel/back. A solid box always culls
        // correctly from every viewing angle, so unlike a thin plane it can
        // never disappear (black) from the front or glow through from the back.
        const head = BABYLON.MeshBuilder.CreateBox(
          `${name}Head`,
          { width: 1.15, height: 0.68, depth: 0.05 },
          scene
        );
        head.parent = pivot;
        head.position.set(0, 0.72, 0);

        const screenMat = new BABYLON.StandardMaterial(`${name}ScreenMat`, scene);
        const emissive = color.scale(2); // 100% brighter than the base color
        screenMat.diffuseColor = color;
        screenMat.emissiveColor = emissive;
        screenMat.specularColor = BABYLON.Color3.Black();
        screenMat.disableLighting = true; // always reads fully lit, regardless of scene lighting

        const headMulti = new BABYLON.MultiMaterial(`${name}HeadMulti`, scene);
        // Babylon's box face order puts "back" at index 0 and "front" at index 1.
        headMulti.subMaterials = [bodyMat, screenMat, bodyMat, bodyMat, bodyMat, bodyMat];
        head.material = headMulti;
        head.subMeshes = [];
        const headVertexCount = head.getTotalVertices();
        [0, 6, 12, 18, 24, 30].forEach((startIndex, faceIndex) => {
          head.subMeshes.push(
            new BABYLON.SubMesh(faceIndex, 0, headVertexCount, startIndex, 6, head)
          );
        });

        // Colored light spilling from the screen onto the desk, like a lit monitor.
        const spill = new BABYLON.PointLight(
          `${name}Light`,
          new BABYLON.Vector3(0, 0.55, -0.2),
          scene
        );
        spill.parent = pivot;
        spill.diffuse = color;
        spill.intensity = 0.9;
        spill.range = 2.5;

        // Click / hover behavior
        head.actionManager = new BABYLON.ActionManager(scene);
        head.actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, () => {
            window.open(url, "_blank", "noopener");
          })
        );
        head.actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPointerOverTrigger, () => {
            canvas.style.cursor = "pointer";
            screenMat.emissiveColor = emissive.scale(1.3);
          })
        );
        head.actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPointerOutTrigger, () => {
            canvas.style.cursor = "default";
            screenMat.emissiveColor = emissive;
          })
        );

        return pivot;
      };

      createMonitor({
        name: "left",
        x: -1.4,
        rotationY: -Math.PI / 7, // angled inward, toward the center monitor
        color: new BABYLON.Color3(1, 1, 1), // white
        url: "https://en.wikipedia.org",
      });

      createMonitor({
        name: "center",
        x: 0,
        rotationY: 0,
        color: new BABYLON.Color3(0.15, 0.45, 1), // blue
        url: "https://github.com",
      });

      createMonitor({
        name: "right",
        x: 1.4,
        rotationY: Math.PI / 7, // angled inward, toward the center monitor
        color: new BABYLON.Color3(1, 0.85, 0.1), // yellow
        url: "https://example.com",
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
