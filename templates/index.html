<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <title>Babylon.js Scene</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #1d1d1d;
    }
    #renderCanvas {
      width: 100%;
      height: 100%;
      touch-action: none;
      display: block;
    }
  </style>
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
</head>
<body>
  <canvas id="renderCanvas"></canvas>
  <script>
    const canvas = document.getElementById("renderCanvas");
    const engine = new BABYLON.Engine(canvas, true);

    // Keeps the whole desk in frame no matter the window's shape. Babylon's
    // default FOV mode holds the *vertical* field of view fixed and derives
    // the horizontal one from the aspect ratio, so the visible width shrinks
    // as the window narrows -- that's what was cutting off the outside
    // monitors when the browser was docked to half the screen.
    //
    // Switching to FOVMODE_HORIZONTAL_FIXED fixes that, but it repurposes
    // camera.fov as the horizontal angle, so the default value (tuned for a
    // vertical FOV) would suddenly describe a much narrower horizontal view
    // than before, cropping it even harder. Instead we compute the
    // horizontal FOV that reproduces the original picture at a normal
    // desktop window (16:9), so nothing changes there, and that same
    // horizontal extent then stays visible at any other window shape.
    const baseRadius = 3.8;
    const baseAspect = 16 / 9;
    const defaultVerticalFov = 0.8; // Babylon's default camera.fov
    const horizontalFov =
      2 * Math.atan(baseAspect * Math.tan(defaultVerticalFov / 2));
    const setupCameraFraming = (camera) => {
      camera.fovMode = BABYLON.Camera.FOVMODE_HORIZONTAL_FIXED;
      camera.fov = horizontalFov;
      camera.radius = baseRadius;
    };

    const createScene = () => {
      const scene = new BABYLON.Scene(engine);
      scene.clearColor = new BABYLON.Color4(0.05, 0.05, 0.07, 1);

      const camera = new BABYLON.ArcRotateCamera(
        "camera",
        -Math.PI / 2,
        Math.PI / 2,
        3.8,
        new BABYLON.Vector3(0, 1.25, 0),
        scene
      );
      camera.lowerRadiusLimit = 2.5;
      camera.upperRadiusLimit = 14;
      camera.wheelPrecision = 50;
      camera.attachControl(canvas, true);
      setupCameraFraming(camera);

      // Right-click resets the camera to its starting framing. Gated on
      // pointerType "mouse" (desktop only) since a touch long-press also
      // fires as a right click. A pointerdown/up pair that stays roughly in
      // place counts as a click and resets; one that moves was a drag (e.g.
      // right-click-panning) and is left alone.
      const defaultCameraState = {
        alpha: camera.alpha,
        beta: camera.beta,
        radius: camera.radius,
        target: camera.target.clone(),
      };

      const nearestEquivalentAngle = (current, target) => {
        const twoPi = Math.PI * 2;
        const raw = target - current;
        return current + (raw - twoPi * Math.round(raw / twoPi));
      };

      const resetCameraView = () => {
        const frameRate = 30;
        const totalFrames = frameRate * 0.4;
        const easing = new BABYLON.CubicEase();
        easing.setEasingMode(BABYLON.EasingFunction.EASINGMODE_EASEINOUT);
        const loop = BABYLON.Animation.ANIMATIONLOOPMODE_CONSTANT;

        BABYLON.Animation.CreateAndStartAnimation(
          "cameraResetAlpha", camera, "alpha", frameRate, totalFrames,
          camera.alpha, nearestEquivalentAngle(camera.alpha, defaultCameraState.alpha), loop, easing
        );
        BABYLON.Animation.CreateAndStartAnimation(
          "cameraResetBeta", camera, "beta", frameRate, totalFrames,
          camera.beta, defaultCameraState.beta, loop, easing
        );
        BABYLON.Animation.CreateAndStartAnimation(
          "cameraResetRadius", camera, "radius", frameRate, totalFrames,
          camera.radius, defaultCameraState.radius, loop, easing
        );
        BABYLON.Animation.CreateAndStartAnimation(
          "cameraResetTarget", camera, "target", frameRate, totalFrames,
          camera.target.clone(), defaultCameraState.target.clone(), loop, easing
        );
      };

      canvas.addEventListener("contextmenu", (e) => e.preventDefault());

      let rightClickStart = null;
      canvas.addEventListener("pointerdown", (e) => {
        if (e.pointerType === "mouse" && e.button === 2) {
          rightClickStart = { x: e.clientX, y: e.clientY };
        }
      });
      canvas.addEventListener("pointerup", (e) => {
        if (e.pointerType !== "mouse" || e.button !== 2 || !rightClickStart) {
          return;
        }
        const moved = Math.hypot(e.clientX - rightClickStart.x, e.clientY - rightClickStart.y);
        rightClickStart = null;
        if (moved < 4) {
          resetCameraView();
        }
      });

      const ambient = new BABYLON.HemisphericLight(
        "ambient",
        new BABYLON.Vector3(0, 1, 0),
        scene
      );
      ambient.intensity = 0.7;

      // A soft key light so the desk/monitor bodies read as more than silhouettes.
      const key = new BABYLON.DirectionalLight(
        "key",
        new BABYLON.Vector3(-0.3, -1, 0.5),
        scene
      );
      key.intensity = 0.5;

      // Glow layer makes the emissive monitor screens actually look lit.
      // A smaller blur kernel than the (32px) default keeps the bloom from
      // bleeding all the way across the screens' black bezels.
      const glow = new BABYLON.GlowLayer("glow", scene, { blurKernelSize: 8 });
      glow.intensity = 1;

      // Galaxy skybox: a big inverted sphere textured with a procedurally
      // drawn starfield/nebula, so no external image assets are needed.
      const skybox = BABYLON.MeshBuilder.CreateSphere(
        "galaxySkybox",
        { diameter: 1000, segments: 32 },
        scene
      );
      skybox.infiniteDistance = true;

      const skyW = 2048;
      const skyH = 1024;
      const skyTexture = new BABYLON.DynamicTexture(
        "galaxyTexture",
        { width: skyW, height: skyH },
        scene,
        false
      );
      const skyCtx = skyTexture.getContext();

      const bgGradient = skyCtx.createLinearGradient(0, 0, 0, skyH);
      bgGradient.addColorStop(0, "#020208");
      bgGradient.addColorStop(0.5, "#06061a");
      bgGradient.addColorStop(1, "#020208");
      skyCtx.fillStyle = bgGradient;
      skyCtx.fillRect(0, 0, skyW, skyH);

      // Soft nebula clouds
      const nebulaColors = [
        "rgba(130, 70, 210, 0.35)",
        "rgba(40, 100, 220, 0.3)",
        "rgba(210, 70, 160, 0.25)",
        "rgba(60, 200, 200, 0.2)",
      ];
      for (let i = 0; i < 28; i++) {
        const cx = Math.random() * skyW;
        const cy = skyH * 0.3 + Math.random() * skyH * 0.4;
        const radius = 100 + Math.random() * 260;
        const color = nebulaColors[Math.floor(Math.random() * nebulaColors.length)];
        const grad = skyCtx.createRadialGradient(cx, cy, 0, cx, cy, radius);
        grad.addColorStop(0, color);
        grad.addColorStop(1, "rgba(0,0,0,0)");
        skyCtx.fillStyle = grad;
        skyCtx.beginPath();
        skyCtx.arc(cx, cy, radius, 0, Math.PI * 2);
        skyCtx.fill();
      }

      // Brighter galactic band running across the middle
      const bandGrad = skyCtx.createLinearGradient(0, skyH * 0.2, 0, skyH * 0.6);
      bandGrad.addColorStop(0, "rgba(255,255,255,0)");
      bandGrad.addColorStop(0.5, "rgba(210,210,255,0.18)");
      bandGrad.addColorStop(1, "rgba(255,255,255,0)");
      skyCtx.fillStyle = bandGrad;
      skyCtx.fillRect(0, skyH * 0.2, skyW, skyH * 0.4);

      // Stars, denser near the galactic band
      const bandCenter = skyH * 0.42;
      const bandSpread = skyH * 0.12;
      for (let i = 0; i < 6000; i++) {
        const x = Math.random() * skyW;
        const y = Math.random() * skyH;
        const dist = y - bandCenter;
        const density = 0.15 + Math.exp(-(dist * dist) / (2 * bandSpread * bandSpread)) * 0.85;
        if (Math.random() > density) continue;
        const size = Math.random() < 0.05 ? 1 + Math.random() * 1.8 : Math.random();
        const brightness = 0.5 + Math.random() * 0.5;
        skyCtx.fillStyle = `rgba(255,255,255,${brightness})`;
        skyCtx.beginPath();
        skyCtx.arc(x, y, size, 0, Math.PI * 2);
        skyCtx.fill();
      }

      skyTexture.update();

      const skyboxMat = new BABYLON.StandardMaterial("galaxySkyboxMat", scene);
      skyboxMat.backFaceCulling = false;
      skyboxMat.disableLighting = true;
      skyboxMat.emissiveTexture = skyTexture;
      skyboxMat.diffuseColor = BABYLON.Color3.Black();
      skyboxMat.specularColor = BABYLON.Color3.Black();
      skybox.material = skyboxMat;

      // Desk
      const deskHeight = 0.75;
      const deskTop = BABYLON.MeshBuilder.CreateBox(
        "deskTop",
        { width: 3.8, depth: 1.4, height: 0.08 },
        scene
      );
      deskTop.position.y = deskHeight;

      // Shiny brushed-metal look: bright specular highlight plus a spherical
      // reflection of the galaxy texture so the desk visibly mirrors the sky.
      // Built from a base64 snapshot of the canvas (not skyTexture directly)
      // so it loads as an independent, ready texture rather than a dynamic
      // one materials would wait on forever.
      const metalReflection = BABYLON.Texture.CreateFromBase64String(
        skyTexture.getContext().canvas.toDataURL(),
        "galaxyReflection",
        scene
      );
      metalReflection.coordinatesMode = BABYLON.Texture.SPHERICAL_MODE;
      metalReflection.level = 0.4;

      const metalMat = new BABYLON.StandardMaterial("metalMat", scene);
      metalMat.diffuseColor = new BABYLON.Color3(0.03, 0.03, 0.03);
      metalMat.specularColor = new BABYLON.Color3(1, 1, 1);
      metalMat.specularPower = 128;
      metalMat.reflectionTexture = metalReflection;
      deskTop.material = metalMat;

      const legMat = new BABYLON.StandardMaterial("legMat", scene);
      legMat.diffuseColor = new BABYLON.Color3(0.02, 0.02, 0.02);
      legMat.specularColor = new BABYLON.Color3(1, 1, 1);
      legMat.specularPower = 128;
      legMat.reflectionTexture = metalReflection;
      const legPositions = [
        [-1.75, 0.55],
        [1.75, 0.55],
        [-1.75, -0.55],
        [1.75, -0.55],
      ];
      legPositions.forEach(([x, z], i) => {
        const leg = BABYLON.MeshBuilder.CreateBox(
          `leg${i}`,
          { width: 0.1, depth: 0.1, height: deskHeight },
          scene
        );
        leg.position.set(x, deskHeight / 2, z);
        leg.material = legMat;
      });

      // Reusable materials for monitor bodies
      const bodyMat = new BABYLON.StandardMaterial("bodyMat", scene);
      bodyMat.diffuseColor = new BABYLON.Color3(0.05, 0.05, 0.05);
      bodyMat.specularColor = new BABYLON.Color3(0.05, 0.05, 0.05);

      // Builds one monitor (stand + screen), wires up glow + click-to-navigate.
      const createMonitor = ({ name, x, rotationY, color, url }) => {
        const pivot = new BABYLON.TransformNode(`${name}Pivot`, scene);
        pivot.position.set(x, deskHeight, 0);
        pivot.rotation.y = rotationY;

        const base = BABYLON.MeshBuilder.CreateCylinder(
          `${name}Base`,
          { diameter: 0.4, height: 0.03 },
          scene
        );
        base.parent = pivot;
        base.position.set(0, 0.015, 0.05);
        base.material = bodyMat;

        const neck = BABYLON.MeshBuilder.CreateBox(
          `${name}Neck`,
          { width: 0.08, depth: 0.08, height: 0.35 },
          scene
        );
        neck.parent = pivot;
        neck.position.set(0, 0.19, 0.05);
        neck.material = bodyMat;

        // The monitor "head" is a plain dark box (bezel + back). A solid box
        // always culls correctly from every viewing angle, so unlike a thin
        // plane it can never disappear (black) from the front or glow
        // through from the back.
        const headWidth = 1.15;
        const headHeight = 0.68;
        const headDepth = 0.05;
        const head = BABYLON.MeshBuilder.CreateBox(
          `${name}Head`,
          { width: headWidth, height: headHeight, depth: headDepth },
          scene
        );
        head.parent = pivot;
        head.position.set(0, 0.72, 0);
        head.material = bodyMat;

        // The glowing screen is a separate, smaller box floating just in
        // front of the head's face, leaving a strip of the dark bezel
        // showing all the way around it. Keeping it as its own mesh (rather
        // than a masked texture on the head's face): GlowLayer
        // blooms from a material's flat emissiveColor and ignores any
        // emissiveTexture, so a black border painted into a texture still
        // glows at full brightness, only real geometry actually blocks it.
        const bezelMargin = 0.06;
        const screenMat = new BABYLON.StandardMaterial(`${name}ScreenMat`, scene);
        const emissive = color.scale(2); // 100% brighter than the base color
        screenMat.diffuseColor = color;
        screenMat.emissiveColor = emissive;
        screenMat.specularColor = BABYLON.Color3.Black();
        screenMat.disableLighting = true; // always reads fully lit, regardless of scene lighting

        const screen = BABYLON.MeshBuilder.CreateBox(
          `${name}Screen`,
          {
            width: headWidth - bezelMargin * 2,
            height: headHeight - bezelMargin * 2,
            depth: 0.01,
          },
          scene
        );
        screen.parent = pivot;
        // Babylon's box face order puts "front" on the -Z side; nudge the
        // screen just past the head's front face (at -headDepth / 2) so it
        // sits proud of the bezel instead of z-fighting with it.
        screen.position.set(0, 0.72, -headDepth / 2 - 0.008);
        screen.material = screenMat;

        // Colored light spilling from the screen onto the desk, like a lit monitor.
        const spill = new BABYLON.PointLight(
          `${name}Light`,
          new BABYLON.Vector3(0, 0.55, -0.2),
          scene
        );
        spill.parent = pivot;
        spill.diffuse = color;
        spill.intensity = 0.9;
        spill.range = 2.5;

        // Click / hover behavior. The screen mesh floats just in front of
        // the head, so it's what actually gets picked at the center of the
        // monitor - both meshes share one ActionManager so clicking either
        // the screen or the surrounding bezel/back navigates.
        const actionManager = new BABYLON.ActionManager(scene);
        actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPickTrigger, () => {
            window.open(url, "_blank", "noopener");
          })
        );
        actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPointerOverTrigger, () => {
            canvas.style.cursor = "pointer";
            screenMat.emissiveColor = emissive.scale(1.3);
          })
        );
        actionManager.registerAction(
          new BABYLON.ExecuteCodeAction(BABYLON.ActionManager.OnPointerOutTrigger, () => {
            canvas.style.cursor = "default";
            screenMat.emissiveColor = emissive;
          })
        );
        head.actionManager = actionManager;
        screen.actionManager = actionManager;

        return pivot;
      };

      createMonitor({
        name: "left",
        x: -1.4,
        rotationY: -Math.PI / 7, // angled inward, toward the center monitor
        color: new BABYLON.Color3(1, 1, 1), // white
        url: "https://linkedin.com/in/carltonduke/",
      });

      createMonitor({
        name: "center",
        x: 0,
        rotationY: 0,
        color: new BABYLON.Color3(0.15, 0.45, 1), // blue
        url: "https://github.com/carltonduke/",
      });

      createMonitor({
        name: "right",
        x: 1.4,
        rotationY: Math.PI / 7, // angled inward, toward the center monitor
        color: new BABYLON.Color3(1, 0.85, 0.1), // yellow
        url: "https://drive.google.com/file/d/1Qok8LrV_gHALDDJedJI1MqsuTE3n3GLh/view?usp=drive_link",
      });

      return scene;
    };

    const scene = createScene();

    engine.runRenderLoop(() => {
      scene.render();
    });

    window.addEventListener("resize", () => {
      engine.resize();
    });
  </script>
</body>
</html>
